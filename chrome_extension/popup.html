<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <title>Omni Studio Auto-Sync</title>
  <style>
    body { width: 300px; font-family: system-ui, sans-serif; background: #0b1411; color: #ecfdf5; margin: 0; padding: 14px; }
    h3 { margin: 0 0 8px; font-size: 15px; color: #34d399; }
    label { display: block; font-size: 12px; color: #a7f3d0; margin: 8px 0 4px; }
    input { width: 100%; box-sizing: border-box; padding: 7px; border-radius: 6px; border: 1px solid #1f4432; background: #06100b; color: #fff; font-size: 12px; }
    button { width: 100%; margin-top: 10px; padding: 8px; border: none; border-radius: 6px; background: #10b981; color: #04130c; font-weight: 700; cursor: pointer; }
    .box { margin-top: 10px; padding: 8px; border-radius: 6px; background: #06100b; border: 1px solid #1a3a2a; font-size: 12px; line-height: 1.45; }
  </style>
</head>
<body>
  <h3>🔄 Omni Studio 24/7 Auto-Sync</h3>
  <label>Tên tài khoản gợi nhớ (tùy chọn):</label>
  <input id="labelInput" placeholder="Ví dụ: Acc Chrome 1" />
  <button id="syncBtn">⚡ Đồng bộ Cookie ngay</button>
  <div class="box" id="statusBox">Đang tải trạng thái…</div>
  <script src="popup.js"></script>
</body>
</html>
